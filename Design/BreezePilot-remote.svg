<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">BreezePilot snowflake with AC remote</title>
  <desc id="description">A delighted ice-blue snowflake in a leather aviator cap and gold goggles holds a white air-conditioner remote against a blue sky.</desc>
